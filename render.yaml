# Render Blueprint: the app runs on Render's free web service, the database is a free Neon Postgres.
# (Render's own free Postgres is deleted after 30 days, which would kill the live link.)
# On the first deploy Render asks for DATABASE_URL: paste the Neon connection string.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
